name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS arm64, because Workspace's tests need APFS clones.
    runs-on: macos-15
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The pinned sandbox-runtime that a cache refresh runs, which Workspace's tests run for real.
      - run: bun install --frozen-lockfile
        working-directory: vendor/sandbox-runtime
      - run: bun run typecheck
      - run: bun test
